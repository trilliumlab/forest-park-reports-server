name: Deno CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DENO_DIR: ./deno-cache
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x # Run with latest stable Deno.
      - name: Cache Deno packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ runner.os }}-deno-cache-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-cache-
      - name: Run linter
        run: deno task check
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: gh_actions
          POSTGRES_USER: gh_actions
          POSTGRES_PASSWORD: gh_actions
        ports:
          - 5432:5432
    env:
      DENO_DIR: ./deno-cache
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x # Run with latest stable Deno.
      - name: Cache Deno packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ runner.os }}-deno-cache-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-cache-
      - name: Create test config
        run: |
          cp config.example.jsonc config.jsonc
          sed -r -i \
            -e 's/<APPLICATION_NAME>/Trail Eyes Github Actions/g' \
            -e 's/<DATABASE_HOST>/localhost/g' \
            -e 's/(<DATABASE_USERNAME>|<DATABASE_PASSWORD>|<DATABASE_NAME>)/gh_actions/g' \
            -e 's/"ssl": true/"ssl": false/g' \
            config.jsonc
          cp config.jsonc config.test.jsonc
      - name: Generate database migrations
        run: deno task db:generate
      - name: Migrate database
        run: deno task db:migrate
      - name: Run tests
        run: deno task test --junit-path report.xml

        # Report test results
#      - name: Test Report
#        uses: dorny/test-reporter@v1
#        if: success() || failure()    # run this step even if previous step failed
#        with:
#          name: JEST Tests            # Name of the check run which will be created
#          path: report.xml    # Path to test results
#          reporter: jest-junit
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'report.xml'
